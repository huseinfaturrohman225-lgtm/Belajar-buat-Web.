<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header class="Judul">
        <h2>Kalcerr Caffe</h2>
        <p>Pilih menu, atur jumlahnya, lalu kirim pesanan ke meja anda.</p>
    </header>
    
    <main class="Tata letak">
    <H6>NAMA MENU</H6>
    <input id="kolomteks" type="text" placeholder="kopi">
    <h6>harga</h6>
    <input id="kolomharga" type="number" placeholder="25000">
    <h6>jumlah</h6>
    <input id="kolomjumlah" type="number" placeholder="1">
    <br>
    <button id="tombol">Tampilkan</button>
    <h1 id="hasil"></h1>


    <script>
    
    let kolomteks = document.getElementById
    ("kolomteks");

    function tampilkanteks() {
        hasil.textContent = kolomteks.value;
    };

    tombol.addEventListener("click", tampilkanteks);

</script>
</body>

</html>
