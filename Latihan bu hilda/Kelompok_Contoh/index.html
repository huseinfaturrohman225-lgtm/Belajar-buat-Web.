<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kedai Senja - Pemesanan Menu</title>
  <link rel="stylesheet" href=".css">
</head>
<body>

  <header class="kepala">
    <h1>Kedai Senja</h1>
    <p>Pilih menu, atur jumlahnya, lalu kirim pesanan ke meja Anda.</p>
  </header>

  <main class="tata-letak">

    <!-- BAGIAN KIRI: daftar menu -->
    <section class="bagian-menu" aria-labelledby="judul-menu">
      <h2 id="judul-menu">Menu</h2>

      <div class="alat">
        <label for="cari-menu" class="sr-only">Cari menu</label>
        <input type="search" id="cari-menu" placeholder="Cari menu,">

        <div class="filter" id="filter-kategori">
          <button type="button" class="filter-tombol aktif" data-kategori="Semua">Semua</button>
          <button type="button" class="filter-tombol" data-kategori="Kopi">Kopi</button>
          <button type="button" class="filter-tombol" data-kategori="Non-Kopi">Non-Kopi</button>
          <button type="button" class="filter-tombol" data-kategori="Makanan">Makanan</button>
          <button type="button" class="filter-tombol" data-kategori="Camilan">Camilan</button>
        </div>
      </div>

      <!-- Pesan kesalahan/keberhasilan saat menambah menu -->
      <p id="pesan-menu" class="pesan sembunyi" role="status"></p>

      <!-- Kartu menu dibuat oleh JavaScript -->
      <div id="daftar-menu" class="daftar-menu"></div>
    </section>

    <!-- BAGIAN KANAN: rincian pesanan -->
    <aside class="bagian-pesanan" aria-labelledby="judul-pesanan">
      <h2 id="judul-pesanan">Pesanan Anda</h2>

      <p id="pesanan-kosong" class="kosong">Belum ada pesanan. Pilih menu lalu tekan Tambah.</p>
      <ul id="daftar-pesanan" class="daftar-pesanan"></ul>

      <dl class="ringkasan">
        <div><dt>Subtotal</dt><dd id="teks-subtotal">Rp0</dd></div>
        <div><dt>Pajak 10%</dt><dd id="teks-pajak">Rp0</dd></div>
        <div class="total"><dt>Total bayar</dt><dd id="teks-total">Rp0</dd></div>
      </dl>

      <label for="nama-pemesan">Nama pemesan</label>
      <input type="text" id="nama-pemesan" placeholder="Contoh: Dina" autocomplete="off">

      <p id="pesan-pesanan" class="pesan sembunyi" role="status"></p>

      <div class="aksi">
        <button type="button" id="tombol-pesan" class="utama">Kirim pesanan</button>
        <button type="button" id="tombol-kosongkan" class="sekunder">Kosongkan</button>
      </div>

      <!-- Struk muncul setelah pesanan dikirim -->
      <div id="struk" class="struk sembunyi"></div>
    </aside>

  </main>

  <footer class="kaki">
    <p>Tugas Cooperative Learning II - Pengantar Pemrograman Web</p>
  </footer>

  <script>
    /* =====================================================
       APLIKASI PEMESANAN MENU KAFE
       Teknik DOM yang dipakai:
       1. Memilih elemen   : getElementById, querySelectorAll
       2. Mengubah isi     : textContent, innerHTML (hanya untuk mengosongkan)
       3. Mengubah tampilan: classList.add / remove / toggle
       4. Membaca input    : .value dan Number()
       5. Membuat elemen   : createElement, appendChild
       6. Menghapus elemen : remove()
       7. Merespons event  : addEventListener (click, input, keydown)
       ===================================================== */

    // ---------- 1. DATA ----------
    // Daftar menu disimpan sebagai array of object.
    const daftarMenu = [
      { id: 1,  nama: "Kopi Susu Gula Aren", kategori: "Kopi",     harga: 22000, deskripsi: "Espresso, susu segar, gula aren" },
      { id: 2,  nama: "Americano",           kategori: "Kopi",     harga: 18000, deskripsi: "Espresso dengan air panas" },
      { id: 3,  nama: "Cafe Latte",          kategori: "Kopi",     harga: 25000, deskripsi: "Espresso dan susu yang lembut" },
      { id: 4,  nama: "Es Teh Lemon",        kategori: "Non-Kopi", harga: 14000, deskripsi: "Teh dingin dengan perasan lemon" },
      { id: 5,  nama: "Matcha Latte",        kategori: "Non-Kopi", harga: 27000, deskripsi: "Matcha dan susu, disajikan dingin" },
      { id: 6,  nama: "Nasi Goreng Kampung", kategori: "Makanan",  harga: 28000, deskripsi: "Dengan telur, ayam suwir, dan acar" },
      { id: 7,  nama: "Mie Goreng Telur",    kategori: "Makanan",  harga: 24000, deskripsi: "Mie goreng bumbu rempah dan telur" },
      { id: 8,  nama: "Roti Bakar Cokelat Keju", kategori: "Camilan", harga: 18000, deskripsi: "Roti tebal, cokelat, dan keju" },
      { id: 9,  nama: "Kentang Goreng",      kategori: "Camilan",  harga: 16000, deskripsi: "Kentang renyah dengan saus sambal" },
      { id: 10, nama: "Pisang Goreng Madu",  kategori: "Camilan",  harga: 15000, deskripsi: "Pisang goreng dengan siraman madu" }
    ];

    const TARIF_PAJAK = 0.10;   // pajak 10%
    const JUMLAH_MAKS = 20;     // batas jumlah per sekali tambah

    // Data pesanan: awalnya kosong, isinya {id, nama, harga, jumlah}
    let pesanan = [];
    let kategoriAktif = "Semua";

    // ---------- 2. MEMILIH ELEMEN ----------
    const elDaftarMenu     = document.getElementById("daftar-menu");
    const elCariMenu       = document.getElementById("cari-menu");
    const elPesanMenu      = document.getElementById("pesan-menu");
    const elPesanPesanan   = document.getElementById("pesan-pesanan");
    const elDaftarPesanan  = document.getElementById("daftar-pesanan");
    const elPesananKosong  = document.getElementById("pesanan-kosong");
    const elSubtotal       = document.getElementById("teks-subtotal");
    const elPajak          = document.getElementById("teks-pajak");
    const elTotal          = document.getElementById("teks-total");
    const elNama           = document.getElementById("nama-pemesan");
    const elTombolPesan    = document.getElementById("tombol-pesan");
    const elTombolKosongkan = document.getElementById("tombol-kosongkan");
    const elStruk          = document.getElementById("struk");
    const semuaTombolFilter = document.querySelectorAll(".filter-tombol");

    // ---------- 3. FUNGSI BANTU ----------

    // Mengubah angka menjadi format rupiah, contoh 22000 -> Rp22.000
    function rupiah(angka) {
      return "Rp" + angka.toLocaleString("id-ID");
    }

    // Menampilkan pesan di halaman (bukan alert).
    // jenis: "error" atau "sukses"
    function tampilkanPesan(elemen, teks, jenis) {
      elemen.textContent = teks;
      elemen.classList.remove("sembunyi", "error", "sukses");
      elemen.classList.add(jenis);
    }

    function sembunyikanPesan(elemen) {
      elemen.textContent = "";
      elemen.classList.add("sembunyi");
    }

    // ---------- 4. MENAMPILKAN DAFTAR MENU ----------
    function tampilkanMenu() {
      const kataKunci = elCariMenu.value.trim().toLowerCase();

      // Saring menu berdasarkan kategori dan kata kunci pencarian
      const hasil = daftarMenu.filter(function (menu) {
        const cocokKategori = (kategoriAktif === "Semua") || (menu.kategori === kategoriAktif);
        const cocokKata = menu.nama.toLowerCase().includes(kataKunci);
        return cocokKategori && cocokKata;
      });

      elDaftarMenu.innerHTML = "";   // kosongkan dulu sebelum diisi ulang

      if (hasil.length === 0) {
        const p = document.createElement("p");
        p.className = "kosong";
        p.textContent = "Menu tidak ditemukan. Coba kata kunci atau kategori lain.";
        elDaftarMenu.appendChild(p);
        return;
      }

      hasil.forEach(function (menu) {
        elDaftarMenu.appendChild(buatKartuMenu(menu));
      });
    }

    // Membuat satu kartu menu lengkap dengan input jumlah dan tombol Tambah
    function buatKartuMenu(menu) {
      const kartu = document.createElement("article");
      kartu.className = "kartu-menu";

      const judul = document.createElement("h3");
      judul.textContent = menu.nama;

      const deskripsi = document.createElement("p");
      deskripsi.className = "deskripsi";
      deskripsi.textContent = menu.deskripsi;

      const harga = document.createElement("p");
      harga.className = "harga";
      harga.textContent = rupiah(menu.harga);

      const baris = document.createElement("div");
      baris.className = "baris-tambah";

      const inputJumlah = document.createElement("input");
      inputJumlah.type = "number";
      inputJumlah.min = "1";
      inputJumlah.value = "1";
      inputJumlah.setAttribute("aria-label", "Jumlah " + menu.nama);

      const tombol = document.createElement("button");
      tombol.type = "button";
      tombol.className = "utama";
      tombol.textContent = "Tambah";

      // Event: klik tombol Tambah
      tombol.addEventListener("click", function () {
        tambahKePesanan(menu, inputJumlah);
      });

      // Event: tekan Enter di kolom jumlah juga menambah menu
      inputJumlah.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          tambahKePesanan(menu, inputJumlah);
        }
      });

      baris.appendChild(inputJumlah);
      baris.appendChild(tombol);

      kartu.appendChild(judul);
      kartu.appendChild(deskripsi);
      kartu.appendChild(harga);
      kartu.appendChild(baris);
      return kartu;
    }

    // ---------- 5. MENAMBAH MENU KE PESANAN ----------
    function tambahKePesanan(menu, inputJumlah) {
      const teksInput = inputJumlah.value.trim();
      const jumlah = Number(teksInput);   // nilai input bertipe string -> ubah ke angka

      // Validasi input: kosong, bukan angka, bukan bilangan bulat, kurang dari 1, terlalu besar
      if (teksInput === "") {
        tampilkanPesan(elPesanMenu, "Jumlah " + menu.nama + " belum diisi. Masukkan angka minimal 1.", "error");
        return;
      }
      if (isNaN(jumlah) || !Number.isInteger(jumlah)) {
        tampilkanPesan(elPesanMenu, "Jumlah harus berupa bilangan bulat, misalnya 2.", "error");
        return;
      }
      if (jumlah < 1) {
        tampilkanPesan(elPesanMenu, "Jumlah minimal 1.", "error");
        return;
      }
      if (jumlah > JUMLAH_MAKS) {
        tampilkanPesan(elPesanMenu, "Jumlah maksimal " + JUMLAH_MAKS + " untuk sekali tambah.", "error");
        return;
      }

      // Jika menu sudah ada di pesanan, tambahkan jumlahnya. Jika belum, buat baris baru.
      const sudahAda = pesanan.find(function (item) { return item.id === menu.id; });
      if (sudahAda) {
        sudahAda.jumlah += jumlah;
      } else {
        pesanan.push({ id: menu.id, nama: menu.nama, harga: menu.harga, jumlah: jumlah });
      }

      inputJumlah.value = "1";
      tampilkanPesan(elPesanMenu, jumlah + " " + menu.nama + " ditambahkan ke pesanan.", "sukses");
      sembunyikanPesan(elPesanPesanan);
      elStruk.classList.add("sembunyi");
      tampilkanPesanan();
    }

    // ---------- 6. MENAMPILKAN RINCIAN PESANAN ----------
    function tampilkanPesanan() {
      elDaftarPesanan.innerHTML = "";

      let subtotal = 0;

      pesanan.forEach(function (item) {
        const subtotalItem = item.harga * item.jumlah;
        subtotal += subtotalItem;

        const li = document.createElement("li");

        const info = document.createElement("div");
        info.className = "info-item";

        const nama = document.createElement("strong");
        nama.textContent = item.nama;

        const rincian = document.createElement("span");
        rincian.textContent = item.jumlah + " x " + rupiah(item.harga);

        info.appendChild(nama);
        info.appendChild(rincian);

        const jumlahHarga = document.createElement("span");
        jumlahHarga.className = "subtotal-item";
        jumlahHarga.textContent = rupiah(subtotalItem);

        const tombolHapus = document.createElement("button");
        tombolHapus.type = "button";
        tombolHapus.className = "hapus";
        tombolHapus.textContent = "Hapus";
        tombolHapus.setAttribute("aria-label", "Hapus " + item.nama + " dari pesanan");

        // Event: hapus baris pesanan
        tombolHapus.addEventListener("click", function () {
          pesanan = pesanan.filter(function (x) { return x.id !== item.id; });
          li.remove();            // lepas elemen dari pohon DOM
          tampilkanPesanan();     // hitung ulang total
        });

        li.appendChild(info);
        li.appendChild(jumlahHarga);
        li.appendChild(tombolHapus);
        elDaftarPesanan.appendChild(li);
      });

      const pajak = Math.round(subtotal * TARIF_PAJAK);
      const total = subtotal + pajak;

      elSubtotal.textContent = rupiah(subtotal);
      elPajak.textContent = rupiah(pajak);
      elTotal.textContent = rupiah(total);

      // Tampilkan atau sembunyikan teks "belum ada pesanan"
      elPesananKosong.classList.toggle("sembunyi", pesanan.length > 0);

      // Matikan tombol jika pesanan kosong
      elTombolPesan.disabled = (pesanan.length === 0);
      elTombolKosongkan.disabled = (pesanan.length === 0);
    }

    // ---------- 7. MENGIRIM DAN MENGOSONGKAN PESANAN ----------
    function kirimPesanan() {
      const namaPemesan = elNama.value.trim();

      if (pesanan.length === 0) {
        tampilkanPesan(elPesanPesanan, "Pesanan masih kosong. Tambahkan menu terlebih dahulu.", "error");
        return;
      }
      if (namaPemesan === "") {
        tampilkanPesan(elPesanPesanan, "Nama pemesan belum diisi.", "error");
        elNama.focus();
        return;
      }

      // Hitung ulang total untuk struk
      let subtotal = 0;
      let jumlahItem = 0;
      pesanan.forEach(function (item) {
        subtotal += item.harga * item.jumlah;
        jumlahItem += item.jumlah;
      });
      const total = subtotal + Math.round(subtotal * TARIF_PAJAK);

      // Susun struk dengan createElement + textContent (aman dari input sembarang)
      elStruk.innerHTML = "";
      const judul = document.createElement("h3");
      judul.textContent = "Pesanan diterima";
      const isi = document.createElement("p");
      isi.textContent = "Terima kasih, " + namaPemesan + ". " + jumlahItem +
        " item sedang disiapkan. Total bayar " + rupiah(total) + ".";
      elStruk.appendChild(judul);
      elStruk.appendChild(isi);
      elStruk.classList.remove("sembunyi");

      // Reset pesanan
      pesanan = [];
      elNama.value = "";
      sembunyikanPesan(elPesanPesanan);
      sembunyikanPesan(elPesanMenu);
      tampilkanPesanan();
    }

    function kosongkanPesanan() {
      pesanan = [];
      elStruk.classList.add("sembunyi");
      sembunyikanPesan(elPesanPesanan);
      tampilkanPesan(elPesanMenu, "Pesanan dikosongkan.", "sukses");
      tampilkanPesanan();
    }

    // ---------- 8. MENGHUBUNGKAN EVENT ----------

    // Event input: pencarian menu langsung diperbarui saat mengetik
    elCariMenu.addEventListener("input", tampilkanMenu);

    // Event click: tombol filter kategori
    semuaTombolFilter.forEach(function (tombol) {
      tombol.addEventListener("click", function () {
        kategoriAktif = tombol.dataset.kategori;

        // Ubah tampilan: hanya tombol terpilih yang diberi kelas "aktif"
        semuaTombolFilter.forEach(function (t) { t.classList.remove("aktif"); });
        tombol.classList.add("aktif");

        tampilkanMenu();
      });
    });

    elTombolPesan.addEventListener("click", kirimPesanan);
    elTombolKosongkan.addEventListener("click", kosongkanPesanan);

    // Event keydown: Enter di kolom nama langsung mengirim pesanan
    elNama.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        kirimPesanan();
      }
    });

    // ---------- 9. TAMPILAN AWAL ----------
    tampilkanMenu();
    tampilkanPesanan();
  </script>
</body>
</html>
